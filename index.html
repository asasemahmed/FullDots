<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8f7f4" />
    <meta
      name="description"
      content="FullDots is a self-hosted workspace for your documents and personal AI assistants."
    />
    <title>FullDots</title>
    <script>
      // Apply the saved theme before the first paint. Keep this in step with src/client/theme.ts.
      (function () {
        try {
          var saved = localStorage.getItem('fulldots-theme');
          var dark =
            saved === 'dark' ||
            (saved !== 'light' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          var theme = dark ? 'dark' : 'light';
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', dark ? '#14171b' : '#f8f7f4');
        } catch (error) {
          /* localStorage can be blocked; the light theme still renders. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
